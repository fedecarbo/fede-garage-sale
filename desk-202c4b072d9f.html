<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Listing desk · Fede's Garage Sale</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Design tokens — the single source of truth. See design/DESIGN.md.
   deck.css may only reference these; never hard-code a color or size there.

   Colours are Apple's system colours (light + dark appearance).
   Sizes follow the tvOS type scale at 1080p, expressed in screen units
   (1rem = 1 % of the width of a 16:9 screen; on a wider window it follows
   the height instead, so a slide never outgrows a short window) and clamped
   so laptops stay sane.
   ───────────────────────────────────────────────────────────── */
html { font-size: min(1vw, 1.7778vh); }   /* the screen unit: 19.2 px at 1080p, 38.4 px at 4K, height-bound on wider windows */

:root {
  color-scheme: light;

  /* Colour · light appearance */
  --bg:        #FFFFFF;                 /* system background */
  --container: #F2F2F7;                 /* grouped background: photo container, cards, list */
  --label:     #000000;
  --label-2:   rgba(60, 60, 67, .6);    /* secondary label */
  --label-3:   rgba(60, 60, 67, .3);    /* tertiary label: inactive page dots */
  --fill:      rgba(120, 120, 128, .16);/* chips */
  --separator: rgba(60, 60, 67, .29);
  --tint:      #007AFF;                 /* used for exactly one thing: the contact button */
  --on-tint:   #FFFFFF;
  --material:  rgba(255, 255, 255, .72);/* pills over photos (with backdrop blur) */
  --tab-on:    #FFFFFF;                 /* the selected tab on the cover's segmented control */
  --green:     #34C759;                 /* system green — used for exactly one thing: the friends' scale at "Best friend" */
  --scrim:     rgba(0, 0, 0, .62);      /* the hold band over a photo — the same in both appearances, it sits on the picture */
  --on-scrim:  #FFFFFF;
  --sold:      #FF3B30;                 /* system red — listing desk only (a .tag, the private card's heading) */
  --reserved:  #FFCC00;                 /* system yellow — listing desk only */
  --on-sold:   #FFFFFF;
  --on-reserved: #1C1C1E;
  --knob:      #FFFFFF;                 /* the friends' scale's thumb — white in both appearances, like a system switch */
  --knob-shadow: 0 .15em .4em rgba(0, 0, 0, .18), 0 0 .05em rgba(0, 0, 0, .08);
  --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .12); /* focused card lift — a hint of depth, not a pop */

  /* Type · system font (SF on Apple devices), tvOS scale at 1080p */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Roboto, sans-serif;
  --fs-price:      clamp(36px, 5.2rem, 124px);   /* 100 px · asking price */
  --fs-large:      clamp(32px, 4.6rem, 110px);   /*  88 px · cover / list title */
  --fs-title:      clamp(24px, 3.1rem, 76px);    /*  60 px · Title 2 · item title */
  --fs-title-long: clamp(20px, 2.5rem, 60px);    /*  48 px · Title 3 · item title over 34 characters */
  --fs-headline:   clamp(17px, 1.98rem, 48px);   /*  38 px · Headline · subtitle */
  --fs-body:       clamp(15px, 1.51rem, 36px);   /*  29 px · Body · description, compare, list rows */
  --fs-card:       clamp(14px, 1.46rem, 35px);   /*  28 px · card title */
  --fs-caption:    clamp(13px, 1.3rem, 31px);    /*  25 px · Caption 1 · eyebrow, pills, chips */

  /* Space · tvOS safe zone (60 pt top/bottom, 80 pt sides) + rhythm */
  --safe-x: 4.17rem;
  --safe-y: 5.56vh;
  --gap-1: .5rem;
  --gap-2: 1rem;
  --gap-3: 1.8rem;
  --gap-4: 2.2rem;
  --photo-w: 53vw;      /* photo container width */
  --text-x: 61.4vw;     /* where the text column starts */
  --grid-gap: .45rem;    /* between photos in the photo grid */
  --thumb: 3.4rem;       /* list thumbnail */
  --dot: .55rem;         /* page dot */
  --switch-w: 15rem;     /* the friends' switch track (≈ 290 px at 1080p); phones ignore it and take the row */

  /* Shape + motion */
  --r-lg: 1.25rem;       /* 24 px · containers, cards, groups */
  --r-md: .6rem;         /* 12 px · photos, thumbnails */
  --r-pill: 999px;
  --dur: 300ms;         /* slide cross-dissolve */
  --dur-fast: 200ms;    /* card lift */
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Dark appearance: follows the system unless config.appearance pins it. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #000000;
    --container: #1C1C1E;
    --label:     #FFFFFF;
    --label-2:   rgba(235, 235, 245, .6);
    --label-3:   rgba(235, 235, 245, .3);
    --fill:      rgba(120, 120, 128, .24);
    --separator: rgba(84, 84, 88, .65);
    --tint:      #0A84FF;
    --material:  rgba(30, 30, 32, .72);
    --tab-on:    rgba(120, 120, 128, .36);
    --green:     #30D158;
    --sold:      #FF453A;
    --reserved:  #FFD60A;
    --knob:      #FFFFFF;
    --knob-shadow: 0 .15em .4em rgba(0, 0, 0, .35), 0 0 .05em rgba(0, 0, 0, .2);
    --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:        #000000;
  --container: #1C1C1E;
  --label:     #FFFFFF;
  --label-2:   rgba(235, 235, 245, .6);
  --label-3:   rgba(235, 235, 245, .3);
  --fill:      rgba(120, 120, 128, .24);
  --separator: rgba(84, 84, 88, .65);
  --tint:      #0A84FF;
  --material:  rgba(30, 30, 32, .72);
  --tab-on:    rgba(120, 120, 128, .36);
  --green:     #30D158;
  --sold:      #FF453A;
  --reserved:  #FFD60A;
  --knob:      #FFFFFF;
  --knob-shadow: 0 .15em .4em rgba(0, 0, 0, .35), 0 0 .05em rgba(0, 0, 0, .2);
  --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .35);
}

/* Phones and portrait windows: iOS sizes in points. */
@media (max-width: 820px), (orientation: portrait) {
  html { font-size: 16px; }
  :root {
    --fs-price: 36px;
    --fs-large: 34px;
    --fs-title: 28px;
    --fs-title-long: 24px;
    --fs-headline: 17px;
    --fs-body: 15px;
    --fs-card: 15px;
    --fs-caption: 13px;
    --safe-x: 16px;
    --safe-y: 16px;
    --gap-1: 6px;
    --gap-2: 12px;
    --gap-3: 16px;
    --gap-4: 20px;
    --thumb: 44px;
    --grid-gap: 4px;
    --r-lg: 20px;
    --r-md: 10px;
    --shadow: 0 6px 14px -6px rgba(0, 0, 0, .15);
  }
}

/* ─────────────────────────────────────────────────────────────
   Listing desk — the private tool Fede uses to post lots on marketplaces.
   Not the deck: the deck is a catalogue for a TV, this is an app for a laptop and a phone.
   It borrows tokens.css for colour, radius, motion and the system font, and sets its own
   (much smaller) type scale, because a tool is read at arm's length, not from a sofa.
   Colours are never hard-coded here — same rule as deck.css. See design/DESIGN.md § Listing desk.
   ───────────────────────────────────────────────────────────── */

html { font-size: 16px; }   /* the deck's screen unit is sized for a TV; neutralise it here */

:root {
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --pad: 16px;
  --max: 1200px;
  --topbar: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: auto; overflow: visible; background: var(--bg); color: var(--label); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: left; }
svg { width: 1em; height: 1em; flex: none; }   /* a sane default: every icon rule below is more specific */
a { color: var(--tint); }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ── Lock screen ────────────────────────────────────────── */
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--pad); }
.lockcard { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.lockcard .glyph { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--container); color: var(--label-2); margin-bottom: 4px; }
.lockcard .glyph svg { width: 30px; height: 30px; }
.lockcard h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.lockcard .sub { font-size: 14px; color: var(--label-2); margin-bottom: 10px; }
.lockcard input { width: 100%; height: 46px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--container); color: var(--label); font-size: 17px; text-align: center; letter-spacing: .25em; }
.lockcard input::placeholder { letter-spacing: normal; color: var(--label-3); }
.lockcard .go { width: 100%; height: 46px; border-radius: 12px; background: var(--tint); color: var(--on-tint); font-size: 16px; font-weight: 600; text-align: center; }
.lockcard .go[disabled] { opacity: .5; }
.lockcard .err { font-size: 13px; color: var(--sold); min-height: 1em; }
.shake { animation: shake .34s var(--ease); }
@keyframes shake { 10%, 90% { transform: translateX(-2px) } 30%, 70% { transform: translateX(5px) } 50% { transform: translateX(-7px) } }

/* ── Shell ──────────────────────────────────────────────── */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: calc(var(--topbar) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) var(--pad) 0; background: var(--material); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--separator); }
.top .ttl { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sp { flex: 1; }
.top .ico { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 -6px; border-radius: 50%; color: var(--tint); }
.top .ico svg { width: 17px; height: 17px; }
.chev { display: inline-flex; align-items: center; gap: 4px; color: var(--tint); font-size: 16px; white-space: nowrap; }
.chev svg { width: 10px; height: 16px; }
.wrap { max-width: var(--max); margin: 0 auto; padding: var(--pad) var(--pad) 40px; }

/* Progress: a hairline under the top bar. */
.prog { position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px)); z-index: 29; height: 3px; background: var(--fill); }
.prog i { display: block; height: 100%; background: var(--green); transition: width var(--dur) var(--ease); }

/* ── Queue ──────────────────────────────────────────────── */
.hero { padding: 8px 4px 18px; }
.hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.hero p { font-size: 15px; color: var(--label-2); margin-top: 5px; }
.hero .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.act { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-pill); background: var(--fill); font-size: 14px; font-weight: 500; }
.act.primary { background: var(--tint); color: var(--on-tint); }
.act.ok { background: var(--green); color: var(--on-tint); }
.act svg { width: 15px; height: 15px; }

.sec { margin-top: 26px; }
.sec > h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--label-2); margin: 0 4px 8px; }
.group { background: var(--container); border-radius: var(--r-lg); overflow: hidden; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; border-top: 1px solid var(--separator); }
.row:first-child { border-top: 0; }
@media (hover: hover) { .row:hover { background: var(--fill); } }
.row:active { opacity: .6; }
.row .th { width: 46px; height: 46px; border-radius: var(--r-md); object-fit: cover; background: var(--fill); display: block; }
.row .t { font-size: 15px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--label-2); }
.row .r { display: flex; align-items: center; gap: 10px; }
.row .amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dotset { display: flex; gap: 3px; }
.dotset i { width: 7px; height: 7px; border-radius: 50%; background: var(--label-3); }
.dotset i.on { background: var(--green); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: var(--r-pill); background: var(--fill); font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--label-2); }
.tag.warn { background: var(--reserved); color: var(--on-reserved); }
.tag.sold { background: var(--sold); color: var(--on-sold); }
.tag.res { background: var(--reserved); color: var(--on-reserved); }
.tag.done { background: var(--green); color: var(--on-tint); }

/* ── Lot ────────────────────────────────────────────────── */
.lot { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .lot { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.side { position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 900px) { .side { position: static; } }

.lothead h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.lothead .sub { font-size: 14px; color: var(--label-2); margin-top: 4px; }
.lothead .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; font-weight: 500; line-height: 1; padding: 6px 10px; border-radius: var(--r-pill); background: var(--fill); }

/* Photos */
.shots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.shots .cell { position: relative; grid-column: span 2; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--fill); display: block; padding: 0; }
.shots[data-n="1"] .cell { grid-column: span 6; aspect-ratio: 16 / 10; }   /* one photo gets the whole width, not a third of it */
.shots[data-n="2"] .cell { grid-column: span 3; }
/* absolute, not height:100% — a percentage height inside a <button> does not resolve in every engine */
.shots img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shots .cell:active { opacity: .6; }
/* solid, not a material: a stock photo is usually white, and a translucent chip vanishes on it */
.shots .cell .lbl { position: absolute; left: 5px; bottom: 5px; padding: 2px 7px; border-radius: var(--r-pill); background: var(--label); color: var(--bg); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.shots .none { grid-column: 1 / -1; aspect-ratio: 3 / 1.4; display: grid; place-items: center; border-radius: var(--r-md); background: var(--fill); color: var(--label-2); font-size: 13px; }

/* ── Cards and steps ────────────────────────────────────── */
.card { background: var(--container); border-radius: var(--r-lg); padding: 14px; }
.card + .card { margin-top: 12px; }
.card > h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--label-2); margin-bottom: 10px; }
.card.warn { background: none; border: 1px solid var(--reserved); }
.card.warn > h3 { color: var(--label); }
.note { font-size: 13px; color: var(--label-2); line-height: 1.4; }
.note + .note { margin-top: 6px; }

/* Platform picker: a segmented control, like the deck's tabs. */
.plats { display: flex; gap: 4px; padding: 4px; background: var(--container); border-radius: var(--r-pill); margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.plats::-webkit-scrollbar { display: none; }
.plat { flex: 1; min-width: max-content; text-align: center; font-size: 14px; font-weight: 500; line-height: 1; padding: 9px 14px; border-radius: var(--r-pill); color: var(--label-2); white-space: nowrap; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.plat.on { background: var(--tab-on); color: var(--label); box-shadow: var(--shadow); }
.plat i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: 1px; opacity: 0; }
.plat.did i { opacity: 1; }

/* A step: a numbered field with the text to copy. */
.step { background: var(--container); border-radius: var(--r-lg); padding: 12px 14px 14px; }
.step + .step { margin-top: 10px; }
.step > header { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.step .n { flex: none; width: 21px; height: 21px; border-radius: 50%; background: var(--tint); color: var(--on-tint); font-size: 12px; font-weight: 700; line-height: 21px; text-align: center; font-variant-numeric: tabular-nums; }
.step .k { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.step .hint { font-size: 12px; color: var(--label-2); font-weight: 400; }
.step .sp { flex: 1; }
.copy { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: var(--r-pill); background: var(--fill); color: var(--tint); font-size: 13px; font-weight: 600; white-space: nowrap; }
.copy svg { width: 13px; height: 13px; }
.copy.done { background: var(--green); color: var(--on-tint); }
.copy:active { opacity: .6; }

.val { font: 14px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--fill); border-radius: var(--r-md); padding: 10px 12px; }
.val.one { white-space: pre-wrap; }
.val.big { font-size: 15px; font-weight: 600; font-family: var(--font); }
.val.scroll { max-height: 320px; overflow: auto; -webkit-overflow-scrolling: touch; }
.val.scroll.over { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); }
.count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--label-2); margin-top: 6px; }
.count.over { color: var(--sold); font-weight: 600; }

/* Price step */
.money { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
.money .big { font-size: 30px; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.money .sm { font-size: 14px; color: var(--label-2); }

/* Private card: floor, what he paid, the comps. Dashed edge so it never reads as buyer-facing. */
.priv { background: none; border: 1px dashed var(--separator); }
.priv > h3 { color: var(--sold); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--label-2); white-space: nowrap; }
.kv dd { text-align: right; font-variant-numeric: tabular-nums; }
.reveal { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-pill); background: var(--fill); font-size: 13px; font-weight: 600; color: var(--tint); }
.why { font-size: 12.5px; line-height: 1.5; color: var(--label-2); margin-top: 10px; max-height: 120px; overflow: hidden; position: relative; }
.why.open { max-height: none; }
.why.open + .more::after { content: "Less"; }
.more { font-size: 12.5px; font-weight: 600; color: var(--tint); margin-top: 6px; }
.more::after { content: "More"; }
.srcs { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 12.5px; }
.srcs a { text-decoration: none; }
.srcs a:hover { text-decoration: underline; }

/* Track: what has been posted where. */
.track { display: flex; flex-direction: column; gap: 8px; }
.tr { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--separator); }
.tr:first-child { border-top: 0; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--label-3); display: grid; place-items: center; color: var(--on-tint); }
.box svg { width: 12px; height: 12px; opacity: 0; }
.tr.on .box { background: var(--green); border-color: var(--green); }
.tr.on .box svg { opacity: 1; }
.tr .nm { font-size: 14px; font-weight: 500; }
.tr .when { font-size: 12px; color: var(--label-2); }
.url { width: 100%; height: 34px; margin-top: 2px; padding: 0 10px; border: 1px solid var(--separator); border-radius: 9px; background: var(--bg); font: 12px/1 var(--mono); color: var(--label); }
.url::placeholder { color: var(--label-3); font-family: var(--font); }
.outcome { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.outcome input { height: 34px; padding: 0 10px; border: 1px solid var(--separator); border-radius: 9px; background: var(--bg); font-size: 13px; min-width: 0; }
.outcome input.px { width: 92px; }
.outcome input.who { flex: 1; min-width: 110px; }

/* Photo checklist */
.shotlist { display: flex; flex-direction: column; gap: 2px; }
.sl { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13.5px; }
.sl .box { width: 20px; height: 20px; border-radius: 6px; }
.sl.on { color: var(--label-2); }
.sl.on .nm { text-decoration: line-through; }
.sl.on .box { background: var(--green); border-color: var(--green); }
.sl.on .box svg { opacity: 1; }

/* ── Bottom bar (phone) ─────────────────────────────────── */
.foot { position: sticky; bottom: 0; z-index: 30; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; margin: 20px calc(-1 * var(--pad)) 0; padding: 10px var(--pad) max(10px, env(safe-area-inset-bottom, 0px)); background: var(--material); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--separator); }
.foot .nav { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--fill); color: var(--tint); }
.foot .nav svg { width: 11px; height: 17px; }
.foot .nav[disabled] { opacity: .35; }
.foot .mid { height: 40px; border-radius: var(--r-pill); background: var(--tint); color: var(--on-tint); font-size: 15px; font-weight: 600; display: grid; place-items: center; text-align: center; }
.foot .mid.ok { background: var(--green); }

/* ── Photo viewer ───────────────────────────────────────── */
.view { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.view .pic { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
.view img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--r-md); }
.view .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--pad) max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--separator); }
.view .fn { font: 12px/1.3 var(--mono); color: var(--label-2); word-break: break-all; }

/* ── Toast ──────────────────────────────────────────────── */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 80; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; padding: 10px 18px; border-radius: var(--r-pill); background: var(--label); color: var(--bg); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Facebook product tags — up to 20 keywords Facebook searches on. Same chip as the lot header. */
.taglist { display: flex; flex-wrap: wrap; gap: 6px; }

</style>

// Listing desk runtime. Reads VAULT (written by desk.mjs), unlocks it with the password, and renders
// one screen per lot: everything needed to post it, in the order a marketplace form asks for it.
// Nothing here is buyer-facing — the floor price, what Fede paid and the comps all live on this page.

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const WORDS = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

// ── The marketplaces. `full` is the name that goes into sale.listed, so the update block Fede pastes
// back to Claude matches what build.mjs and tally.mjs expect. `limit` is the title length each one allows.
const PLATFORMS = [
  { id: 'ebay', name: 'eBay', full: 'eBay UK', limit: 80, hard: true },
  { id: 'fb', name: 'Facebook', full: 'Facebook Marketplace', limit: 100 },
  { id: 'gum', name: 'Gumtree', full: 'Gumtree', limit: 70 },
  { id: 'vin', name: 'Vinted', full: 'Vinted', limit: 100 },
];

];

// ── Unlock ───────────────────────────────────────────────
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unseal(pw) {
  if (VAULT.plain) { if (pw !== VAULT.check) throw new Error('bad'); return VAULT.plain; }
  if (!globalThis.crypto?.subtle) throw new Error('nocrypto');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
async function unlock(pw) {
  const btn = $('#lockform .go'), err = $('#err');
  if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; }
  try {
    const data = await unseal(pw);
    try { sessionStorage.setItem('desk-pw', pw); } catch {}
    boot(data);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Open'; }
    if (err) { err.hidden = false; err.textContent = e.message === 'nocrypto' ? 'This browser will not unlock a local file. Open it in Chrome, or run: node desk.mjs --plain' : 'Wrong password'; }
    $('#lockform')?.classList.remove('shake');
    void $('#lockform')?.offsetWidth;
    $('#lockform')?.classList.add('shake');
    $('#pw')?.select();
  }
}
document.addEventListener('submit', e => { if (e.target.id === 'lockform') { e.preventDefault(); unlock($('#pw').value); } });
try { const saved = sessionStorage.getItem('desk-pw'); if (saved) unlock(saved); } catch {}

// ── Boot ─────────────────────────────────────────────────
let fmt, fmt2;
function boot(data) {
  C = data.config; LOTS = data.lots; BUILT = data.built;
  fmt = new Intl.NumberFormat(C.locale || 'en-GB', { style: 'currency', currency: C.currency || 'GBP', maximumFractionDigits: 0 });
  fmt2 = new Intl.NumberFormat(C.locale || 'en-GB', { style: 'currency', currency: C.currency || 'GBP', minimumFractionDigits: 2 });
  load();
  $('#lock').hidden = true;
  $('#app').hidden = false;
  document.body.classList.add('ready');
  const h = location.hash.slice(1);
  const i = LOTS.findIndex(l => l.slug === h);
  render(i >= 0 ? { screen: 'lot', i } : { screen: 'queue' });
}
const money = n => typeof n === 'number' ? fmt.format(n) : '';
const money2 = n => typeof n !== 'number' ? '' : Number.isInteger(n) ? fmt.format(n) : fmt2.format(n);

// ── State: what has been posted where. Kept on this device; product.json seeds it. ──
const KEY = 'desk-state-v1';
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { S = {}; }
  for (const lot of LOTS) {
    const x = S[lot.slug] ||= {};
    for (const entry of lot.listed || []) {           // "Facebook Marketplace 2026-09-01 https://…"
      const p = PLATFORMS.find(p => entry.toLowerCase().startsWith(p.full.toLowerCase()) || entry.toLowerCase().startsWith(p.name.toLowerCase()));
      if (!p || x[p.id]) continue;
      x[p.id] = { on: true, seeded: true, date: (entry.match(/\d{4}-\d{2}-\d{2}/) || [''])[0], url: (entry.match(/https?:\/\/\S+/) || [''])[0] };
    }
    if (lot.sold && !x.sold) x.sold = { price: lot.sold.price, buyer: lot.sold.buyer, date: lot.sold.date, seeded: true };
    if (lot.reservedFor && !x.res) x.res = { who: lot.reservedFor, seeded: true };
  }
  save();
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const st = lot => (S[lot.slug] ||= {});
const postedOn = lot => PLATFORMS.filter(p => st(lot)[p.id]?.on);
const isDone = lot => lot.status !== 'ready' || !!st(lot).sold || !!st(lot).res;

// ── The text a marketplace form asks for ─────────────────
const P = id => PLATFORMS.find(p => p.id === id);
// eBay allows 80 characters: the title, then as many whole " · " segments of the subtitle as fit.
function titleFor(lot, p) {
  let t = lot.title;
  for (const s of (lot.subtitle || '').split(' · ')) if (s && (t + ' · ' + s).length <= p.limit) t += ' · ' + s;
  return t;
}
function priceFor(lot) {
  if (lot.asking === 0) return 'Free';
  const each = money(lot.asking) + (lot.unit ? ` ${lot.unit}` : '');
  return typeof lot.setPrice === 'number' ? `${each} · ${money(lot.setPrice)} for ${lot.quantity ? `all ${WORDS[lot.quantity] || lot.quantity}` : 'the set'}` : each;
}
function catFor(lot, p) {
  const hay = `${lot.title} ${lot.subtitle || ''} ${lot.category || ''}`;
  const hit = CATS.find(([re]) => re.test(hay));
  if (p.id === 'ebay') return hit ? hit[1] : CAT_FALLBACK.ebay;
  if (p.id === 'fb') return hit ? hit[2] : CAT_FALLBACK.fb;
  return `Closest match to “${lot.category || lot.section || 'Home'}” — ${p.name} suggests one from your title`;
}
// The description: one sentence, the facts as bullets, the condition said plainly, then Fede's standard lines.
function bodyFor(lot) {
  const out = [];
  if (lot.description) out.push(lot.description);
  const bullets = [...(lot.highlights || []), ...Object.entries(lot.details || {}).map(([k, v]) => `${k}: ${v}`)];
  if (bullets.length) out.push('', ...bullets.map(b => '• ' + b));
  const stop = s => /[.!?]$/.test(s.trim()) ? s.trim() : s.trim() + '.';
  const cond = [];
  if (lot.condition) cond.push(`Condition: ${lot.condition.toLowerCase()}.`);
  if (lot.flaws) cond.push(stop(lot.flaws));
  if (cond.length) out.push('', cond.join(' '));
  if (lot.notes) out.push('', stop(lot.notes));
  if (typeof lot.setPrice === 'number') out.push('', `${money(lot.asking)} ${lot.unit || 'each'}, or ${money(lot.setPrice)} for ${lot.quantity ? `all ${WORDS[lot.quantity] || lot.quantity}` : 'the set'}.`);
  if ((C.listing_footer || []).length) out.push('', ...C.listing_footer);
  return out.join('\n');
}
// ── Facebook product tags ────────────────────────────────
// Facebook Marketplace takes up to 20 free-text tags and searches on them, so they are worth filling:
// the model number and the words a buyer would actually type, not the marketing ones. Built from what
// the lot already knows — no new field in product.json. Most searchable first, since 20 is the cap.
const TAG_LIMIT = 20;
const TAG_STOP = new Set(['the', 'a', 'an', 'and', 'or', 'with', 'for', 'from', 'in', 'on', 'of', 'to', 'by', 'its', 'it', 'all', 'plus', 'via', 'x', 'cm', 'mm', 'kg', 'w', 'd', 'h',
  // filler that reads fine in a highlight but that nobody types into a search box
  'available', 'old', 'year', 'years', 'under', 'over', 'about', 'approx', 'if', 'wanted', 'each', 'both', 'two', 'still', 'no', 'not', 'only', 'per', 'up', 'as', 'is', 'has', 'inc', 'incl', 'included', 'includes']);
const MODELISH = /^(?=.*[a-z])(?=.*\d)[a-z0-9][a-z0-9-]{2,}$/i;   // dcd776, qn88c, aw2721d, tm7, 18v — letters and digits both
function tagsFor(lot) {
  const out = [];
  const add = t => {
    t = String(t ?? '').toLowerCase().replace(/[^a-z0-9+&\s-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (t.length < 2 || TAG_STOP.has(t) || /^[\d-]+$/.test(t)) return;
    if (out.length < TAG_LIMIT && !out.includes(t)) out.push(t);
  };
  const words = s => String(s ?? '').split(/[^A-Za-z0-9+&-]+/).filter(Boolean);
  const tw = words(lot.title);
  add(lot.title);                                                                  // the whole name, as one tag
  for (const w of [...tw, ...words(lot.subtitle)]) if (MODELISH.test(w)) add(w);    // model numbers: what people actually search
  if (tw[0]) add(tw[0]);                                                           // the brand
  for (const w of tw) add(w);
  for (let i = 0; i < tw.length - 1; i++) add(tw[i] + ' ' + tw[i + 1]);             // "combi drill", "ironing board"
  add(lot.category);
  for (const h of lot.highlights || []) {           // "Dolby Atmos" is a search term; "6 available" is not
    const hw = words(h);
    if (hw.length <= 3 && !/\d/.test(h)) add(h);
    for (const w of hw) add(w);
  }
  for (const w of words(lot.subtitle)) add(w);
  return out;
}
// The area is public, the full postcode is not: config.collection_area, plus the outward half of the postcode.
const locFor = () => `${C.collection_area || 'Collection in person'}${C.collection_postcode ? ` (${C.collection_postcode.split(' ')[0]})` : ''}`;
const allFor = (lot, p) => [titleFor(lot, p), priceFor(lot), '', bodyFor(lot)].join('\n');
const textFor = (lot, p, what) => ({
  title: titleFor(lot, p), cat: catFor(lot, p), cond: COND[p.id][lot.condition] || lot.condition || 'Used',
  price: lot.asking === 0 ? '0' : String(lot.asking), desc: bodyFor(lot), loc: locFor(),
  tags: tagsFor(lot).join(', '), postcode: C.collection_postcode || '', all: allFor(lot, p),
}[what] || '');

// ── Copy, with a fallback for file:// where the clipboard API is not allowed ──
function copyText(text) {
  return new Promise(res => {
    if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => res(true), () => res(legacy(text)));
    res(legacy(text));
  });
}
function legacy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  const sel = getSelection(), range = document.createRange();
  ta.contentEditable = 'true';
  range.selectNodeContents(ta);
  sel.removeAllRanges(); sel.addRange(range);
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  sel.removeAllRanges();
  ta.remove();
  return ok;
}
let toastT;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);

}

let route = { screen: "queue" };
function render(next, keep) {
  if (next) route = next;

  const app = $("#app");
  app.innerHTML = route.screen === "lot" ? lotScreen(route.i) : queueScreen();
  app.querySelectorAll('.val.scroll').forEach(el => el.classList.toggle('over', el.scrollHeight > el.clientHeight + 2));
  if (route.screen === "lot") { cur = route.i; location.hash = LOTS[cur].slug; }

function queueScreen() {
  const ready = LOTS.filter(l => l.status === 'ready');
  const todo = ready.filter(l => !postedOn(l).length && !isDone(l));
  const live = ready.filter(l => postedOn(l).length && !isDone(l));
  const done = LOTS.filter(l => isDone(l));
  const worth = ready.filter(l => !isDone(l)).reduce((t, l) => t + (l.setPrice ?? l.asking ?? 0), 0);
  const posted = ready.length - todo.length;
  const shots = ready.filter(l => l.photos.length && l.photos.every(p => p.stock)).length;

function rowFor(lot) {

}

}

          ${step(2, 'cat', 'Category', 'suggested', `<div class="val one">${esc(catFor(lot, p))}</div>`)}
          ${step(3, 'cond', 'Condition', `as ${p.name} words it`, `<div class="val big">${esc(COND[p.id][lot.condition] || lot.condition || 'Used')}</div>`, { nocopy: true })}
          ${step(4, 'price', 'Price', 'ask this', `<div class="money"><span class="big">${lot.asking === 0 ? 'Free' : money(lot.asking)}${lot.unit ? ` <span class="sm">${esc(lot.unit)}</span>` : ''}</span>${typeof lot.setPrice === 'number' ? `<span class="sm">or ${money(lot.setPrice)} for ${lot.quantity ? `all ${WORDS[lot.quantity] || lot.quantity}` : 'the set'}</span>` : ''}${typeof lot.original === 'number' ? `<span class="sm">${money(lot.original)} new</span>` : ''}</div>`)}
          ${step(5, 'desc', 'Description', 'paste the lot', `<div class="val scroll">${esc(bodyFor(lot))}</div>`)}
          ${p.id === 'fb' ? step(6, 'tags', 'Product tags', `up to ${TAG_LIMIT} — Facebook searches these`, `<div class="taglist">${tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div><div class="count">${tags.length} / ${TAG_LIMIT} — Copy pastes them comma-separated</div>`) : ''}
          ${step(p.id === 'fb' ? 7 : 6, 'loc', 'Location', 'public — the area only', `<div class="val one">${esc(locFor())}</div>`)}

          <section class="card priv">
            <h3>Yours only — never paste this</h3>
            <dl class="kv">
              ${typeof lot.floor === 'number' ? `<dt>Never go below</dt><dd>${money(lot.floor)}${lot.unit ? ' ' + esc(lot.unit) : ''}</dd>` : ''}
              ${lot.used ? `<dt>Seen used at</dt><dd>${money(lot.used[0])} – ${money(lot.used[1])}</dd>` : ''}
              ${typeof lot.paid === 'number' ? `<dt>You paid</dt><dd>${money2(lot.paid)}${lot.retailer ? `<span class="hint"> · ${esc(lot.retailer.split(' (')[0])}</span>` : ''}</dd>` : ''}
              ${lot.drop ? `<dt>Drop to ${money(lot.drop.price)}</dt><dd>after ${esc(lot.drop.date)}</dd>` : lot.holds ? '<dt>Price holds</dt><dd>no drops</dd>' : ''}
            </dl>
            <div style="margin-top:10px"><button class="reveal" data-reveal>Show the full postcode</button><div class="val one" data-postcode hidden style="margin-top:8px">${esc(C.collection_postcode || "—")}</div></div>
            ${lot.why ? `<div class="why">${esc(lot.why)}</div><button class="more" data-more></button>` : ''}
            ${lot.sources?.length ? `<div class="srcs">${lot.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.label)}${typeof x.price === 'number' ? ` · ${money(x.price)}` : ''}</a>`).join('')}</div>` : ''}
          </section>

          <section class="card">
            <h3>Posted where</h3>
            <div class="track">${PLATFORMS.map(x => {
              const t = s[x.id] || {};
              return `<div class="tr ${t.on ? 'on' : ''}">
                <button class="box" data-track="${x.id}" aria-label="Mark ${esc(x.full)}">${IC.tick}</button>
                <span><span class="nm">${esc(x.full)}</span>${t.on ? `<span class="when"> · ${esc(t.date || today())}</span>` : ''}
                  ${t.on ? `<input class="url" data-url="${x.id}" value="${esc(t.url || '')}" placeholder="paste the link" inputmode="url">` : ''}</span>
              </div>`;
            }).join('')}</div>
            <div class="outcome">
              <input class="px" data-sold-price inputmode="decimal" placeholder="Sold for" value="${esc(s.sold?.price ?? '')}">
              <input class="who" data-sold-who placeholder="Buyer" value="${esc(s.sold?.buyer ?? s.res?.who ?? '')}">
              <button class="act" data-mark="res">Reserved</button>
              <button class="act ${s.sold ? 'ok' : ''}" data-mark="sold">${s.sold ? 'Sold ✓' : 'Sold'}</button>
            </div>
          </section>
        </div>
      </div>
      <div class="foot">
        <button class="nav" data-go="${i - 1}" ${i === 0 ? 'disabled' : ''} aria-label="Previous lot">${IC.left}</button>
        <button class="mid" data-copy="all">Copy the whole listing</button>
        <button class="nav" data-go="${nextTodo >= 0 ? nextTodo : i + 1}" ${i >= LOTS.length - 1 ? 'disabled' : ''} aria-label="Next lot">${IC.right}</button>
      </div>
    </div>`;
}

// ── The block Fede pastes back to Claude ─────────────────
function updateText() {
  const lines = [];
  for (const lot of LOTS) {
    const s = st(lot);
    for (const p of PLATFORMS) {
      const t = s[p.id];
      if (t?.on && !t.seeded) lines.push(`${lot.slug}: listed on ${p.full} ${t.date || today()}${t.url ? ' ' + t.url : ''}`);
    }
    if (s.sold && !s.sold.seeded) lines.push(`${lot.slug}: SOLD ${money(+s.sold.price || 0)} to ${s.sold.buyer || '?'} on ${s.sold.date || today()}`);
    if (s.res && !s.res.seeded && !s.sold) lines.push(`${lot.slug}: RESERVED for ${s.res.who || '?'}`);
  }
  return lines.length
    ? `Listing desk update — ${today()}\n\n${lines.join('\n')}\n\n(Put these into the products' sale blocks.)`
    : `Listing desk — ${today()}: nothing new since the last update.`;
}

// ── Photo viewer ─────────────────────────────────────────
function showPhoto(j) {
  const lot = LOTS[cur];
  if (!lot.photos.length) return;
  view = (j + lot.photos.length) % lot.photos.length;
  const ph = lot.photos[view];
  const url = `products/${encodeURIComponent(lot.slug)}/${encodeURIComponent(ph.f)}`;
  let el = $('.view');
  if (!el) { el = document.createElement('div'); el.className = 'view'; document.body.appendChild(el); }
  el.innerHTML = `<div class="pic"><img src="${url}" alt="${esc(lot.title)}"></div>
    <div class="bar"><button class="nav act" data-pv="-1">${IC.left}</button>
      <span class="fn">${esc(ph.f)} · ${view + 1} of ${lot.photos.length}${ph.stock ? ' · stock' : ''}<br><a href="${url}" download="${esc(lot.slug)}-${view + 1}.jpg">Save this photo</a></span>
      <button class="nav act" data-pv="1">${IC.right}</button>
      <button class="act primary" data-close>Done</button></div>`;
}
const closePhoto = () => { view = null; $('.view')?.remove(); };

// ── Events ───────────────────────────────────────────────
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('[data-lock]')) { try { sessionStorage.removeItem('desk-pw'); } catch {} return location.reload(); }
  if (t.closest('[data-close]')) return closePhoto();
  const pv = t.closest('[data-pv]');
  if (pv) return showPhoto(view + +pv.dataset.pv);
  const ph = t.closest('[data-photo]');
  if (ph) return showPhoto(+ph.dataset.photo);
  if (t.closest('[data-queue]')) return render({ screen: 'queue' });
  const go = t.closest('[data-go]');
  if (go) { const i = +go.dataset.go; if (i >= 0 && i < LOTS.length) return render({ screen: 'lot', i }); return; }
  const pl = t.closest('[data-plat]');
  if (pl) { plat = pl.dataset.plat; return render(null, true); }

  const cp = t.closest('[data-copy]');
  if (cp) {
    const ok = await copyText(textFor(LOTS[cur], P(plat), cp.dataset.copy));
    if (ok) { cp.classList.add('done'); const was = cp.innerHTML; cp.innerHTML = `${IC.tick} Copied`; setTimeout(() => { cp.classList.remove('done'); cp.innerHTML = was; }, 1400); }
    else toast('Could not copy — select the text instead');
    return;
  }
  if (t.closest('[data-copy-update]')) { const ok = await copyText(updateText()); return toast(ok ? 'Copied — paste it to Claude' : 'Could not copy'); }
  if (t.closest('[data-reveal]')) { const el = $('[data-postcode]'); el.hidden = false; t.closest('[data-reveal]').remove(); return; }
  const more = t.closest('[data-more]');
  if (more) return more.previousElementSibling.classList.toggle('open');

  const tr = t.closest('[data-track]');
  if (tr) {
    const id = tr.dataset.track, s = st(LOTS[cur]);
    s[id] = s[id]?.on ? undefined : { on: true, date: today(), url: '' };
    if (!s[id]) delete s[id];
    save(); return render(null, true);
  }
  const shot = t.closest('[data-shot]');
  if (shot) { const s = st(LOTS[cur]); s.shots ||= {}; const j = shot.dataset.shot; s.shots[j] = !s.shots[j]; save(); return render(null, true); }
  const mark = t.closest('[data-mark]');
  if (mark) {
    const s = st(LOTS[cur]);
    const price = $('[data-sold-price]')?.value.trim(), who = $('[data-sold-who]')?.value.trim();
    if (mark.dataset.mark === 'sold') {
      if (!price) return toast('What did it sell for?');
      s.sold = { price: +price.replace(/[^\d.]/g, ''), buyer: who, date: today() };
      delete s.res;
      toast('Sold — it is in the update block');
    } else {
      if (!who) return toast('Who is it reserved for?');
      s.res = { who };
      toast('Reserved — it is in the update block');
    }
    save(); return render(null, true);
  }
});
document.addEventListener('input', e => {
  const u = e.target.closest('[data-url]');
  if (!u) return;
  const s = st(LOTS[cur]), id = u.dataset.url;
  if (s[id]) { s[id].url = u.value.trim(); s[id].seeded = false; save(); }
});
addEventListener('keydown', e => {
  if ($('#app').hidden) return;
  if (e.target.matches('input, textarea')) return;
  if (view !== null) {
    if (e.key === 'Escape') return closePhoto();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') return showPhoto(view + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') return showPhoto(view - 1);
    return;
  }
  if (e.key === 'Escape') return render({ screen: 'queue' });
  if (route.screen !== "lot") return;
  if (e.key === 'ArrowRight' && cur < LOTS.length - 1) render({ screen: 'lot', i: cur + 1 });
  if (e.key === 'ArrowLeft' && cur > 0) render({ screen: 'lot', i: cur - 1 });
});

</script>
</body>
</html>
