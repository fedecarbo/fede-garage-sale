<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fede's Garage Sale</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Design tokens — the single source of truth. See design/DESIGN.md.
   deck.css may only reference these; never hard-code a color or size there.

   Colours are Apple's system colours (light + dark appearance).
   Sizes follow the tvOS type scale at 1080p, expressed in screen units
   (1rem = 1 % of the width of a 16:9 screen; on a wider window it follows
   the height instead, so a slide never outgrows a short window) and clamped
   so laptops stay sane.
   ───────────────────────────────────────────────────────────── */
html { font-size: min(1vw, 1.7778vh); }   /* the screen unit: 19.2 px at 1080p, 38.4 px at 4K, height-bound on wider windows */

:root {
  color-scheme: light;

  /* Colour · light appearance */
  --bg:        #FFFFFF;                 /* system background */
  --container: #F2F2F7;                 /* grouped background: photo container, cards, list */
  --label:     #000000;
  --label-2:   rgba(60, 60, 67, .6);    /* secondary label */
  --label-3:   rgba(60, 60, 67, .3);    /* tertiary label: inactive page dots */
  --fill:      rgba(120, 120, 128, .16);/* chips */
  --separator: rgba(60, 60, 67, .29);
  --tint:      #007AFF;                 /* used for exactly one thing: the contact button */
  --on-tint:   #FFFFFF;
  --material:  rgba(255, 255, 255, .72);/* pills over photos (with backdrop blur) */
  --tab-on:    #FFFFFF;                 /* the selected tab on the cover's segmented control */
  --scrim:     rgba(0, 0, 0, .62);      /* the hold band over a photo — the same in both appearances, it sits on the picture */
  --on-scrim:  #FFFFFF;
  --sold:      #FF3B30;                 /* system red — listing desk only (a .tag, the private card's heading) */
  --reserved:  #FFCC00;                 /* system yellow — listing desk only */
  --on-sold:   #FFFFFF;
  --on-reserved: #1C1C1E;
  --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .12); /* focused card lift — a hint of depth, not a pop */

  /* Type · system font (SF on Apple devices), tvOS scale at 1080p */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Roboto, sans-serif;
  --fs-price:      clamp(36px, 5.2rem, 124px);   /* 100 px · asking price */
  --fs-large:      clamp(32px, 4.6rem, 110px);   /*  88 px · cover / list title */
  --fs-title:      clamp(24px, 3.1rem, 76px);    /*  60 px · Title 2 · item title */
  --fs-title-long: clamp(20px, 2.5rem, 60px);    /*  48 px · Title 3 · item title over 34 characters */
  --fs-headline:   clamp(17px, 1.98rem, 48px);   /*  38 px · Headline · subtitle */
  --fs-body:       clamp(15px, 1.51rem, 36px);   /*  29 px · Body · description, compare, list rows */
  --fs-card:       clamp(14px, 1.46rem, 35px);   /*  28 px · card title */
  --fs-caption:    clamp(13px, 1.3rem, 31px);    /*  25 px · Caption 1 · eyebrow, pills, chips */

  /* Space · tvOS safe zone (60 pt top/bottom, 80 pt sides) + rhythm */
  --safe-x: 4.17rem;
  --safe-y: 5.56vh;
  --gap-1: .5rem;
  --gap-2: 1rem;
  --gap-3: 1.8rem;
  --gap-4: 2.2rem;
  --photo-w: 53vw;      /* photo container width */
  --text-x: 61.4vw;     /* where the text column starts */
  --grid-gap: .45rem;    /* between photos in the photo grid */
  --thumb: 3.4rem;       /* list thumbnail */
  --dot: .55rem;         /* page dot */

  /* Shape + motion */
  --r-lg: 1.25rem;       /* 24 px · containers, cards, groups */
  --r-md: .6rem;         /* 12 px · photos, thumbnails */
  --r-pill: 999px;
  --dur: 300ms;         /* slide cross-dissolve */
  --dur-fast: 200ms;    /* card lift */
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Dark appearance: follows the system unless config.appearance pins it. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #000000;
    --container: #1C1C1E;
    --label:     #FFFFFF;
    --label-2:   rgba(235, 235, 245, .6);
    --label-3:   rgba(235, 235, 245, .3);
    --fill:      rgba(120, 120, 128, .24);
    --separator: rgba(84, 84, 88, .65);
    --tint:      #0A84FF;
    --material:  rgba(30, 30, 32, .72);
    --tab-on:    rgba(120, 120, 128, .36);
    --sold:      #FF453A;
    --reserved:  #FFD60A;
    --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:        #000000;
  --container: #1C1C1E;
  --label:     #FFFFFF;
  --label-2:   rgba(235, 235, 245, .6);
  --label-3:   rgba(235, 235, 245, .3);
  --fill:      rgba(120, 120, 128, .24);
  --separator: rgba(84, 84, 88, .65);
  --tint:      #0A84FF;
  --material:  rgba(30, 30, 32, .72);
  --tab-on:    rgba(120, 120, 128, .36);
  --sold:      #FF453A;
  --reserved:  #FFD60A;
  --shadow:    0 .7rem 1.6rem -.7rem rgba(0, 0, 0, .35);
}

/* Phones and portrait windows: iOS sizes in points. */
@media (max-width: 820px), (orientation: portrait) {
  html { font-size: 16px; }
  :root {
    --fs-price: 36px;
    --fs-large: 34px;
    --fs-title: 28px;
    --fs-title-long: 24px;
    --fs-headline: 17px;
    --fs-body: 15px;
    --fs-card: 15px;
    --fs-caption: 13px;
    --safe-x: 16px;
    --safe-y: 16px;
    --gap-1: 6px;
    --gap-2: 12px;
    --gap-3: 16px;
    --gap-4: 20px;
    --thumb: 44px;
    --grid-gap: 4px;
    --r-lg: 20px;
    --r-md: 10px;
    --shadow: 0 6px 14px -6px rgba(0, 0, 0, .15);
  }
}

/* Components. Colors and sizes come from tokens.css only. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--label); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: max(3px, .2vw) solid var(--tint); outline-offset: .3vw; }

/* ── Slides ─────────────────────────────────────────────── */
.slide { position: fixed; inset: 0; opacity: 0; pointer-events: none; transform: scale(.98); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.slide.active { opacity: 1; pointer-events: auto; transform: none; }

/* ── Product ────────────────────────────────────────────── */
.body { position: absolute; inset: var(--safe-y) var(--safe-x); display: grid; grid-template-columns: var(--photo-w) minmax(0, 1fr); grid-template-rows: auto auto auto auto minmax(0, 1fr); column-gap: calc(var(--text-x) - var(--safe-x) - var(--photo-w)); grid-template-areas: "photo head" "photo chips" "photo desc" "photo details" "photo buy"; }
.head { grid-area: head; min-width: 0; }
.desc { grid-area: desc; }
.chips { grid-area: chips; align-self: start; }
.details { grid-area: details; align-self: start; }
.buy { grid-area: buy; align-self: end; }

/* Photo grid: every photo of the lot in one container; the shape follows the count. */
.photo.held { --band-h: 3.7rem; }   /* the band's own height, so "Stock photo" and "2 of 4" sit above it */
.photo { grid-area: photo; position: relative; min-height: 0; background: var(--container); border-radius: var(--r-lg); overflow: hidden; display: grid; gap: var(--grid-gap); padding: var(--grid-gap); grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.photo .cell { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-radius: var(--r-md); background: var(--fill); grid-column: span 6; cursor: pointer; }
.photo .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .cell .pill { position: absolute; right: var(--gap-2); bottom: calc(var(--gap-2) + var(--band-h, 0rem)); }
.photo .cell .pill.top { bottom: auto; top: var(--gap-2); }
.photo .empty { grid-column: span 6; display: flex; align-items: center; justify-content: center; font-size: var(--fs-headline); color: var(--label-2); }
.photo[data-n="1"], .photo.focus { padding: 0; }
.photo[data-n="1"] .cell, .photo.focus .cell { border-radius: 0; grid-column: span 6; grid-row: auto; }
.photo.cols .cell { grid-column: span 3; }                        /* 2 · side by side */
.photo.rows .cell { grid-column: span 6; }                        /* 2 · stacked (both landscape) */
.photo[data-n="3"] .cell { grid-column: span 2; }                 /* 3 · one large, two small */
.photo[data-n="3"] .cell:first-child { grid-column: span 4; grid-row: span 2; }
.photo[data-n="4"] .cell { grid-column: span 3; }                 /* 4 · two by two */
.photo[data-n="5"] .cell { grid-column: span 2; }                 /* 5 · two over three */
.photo[data-n="5"] .cell:nth-child(-n+2) { grid-column: span 3; }
.photo[data-n="6"] .cell { grid-column: span 2; }                 /* 6 · three by two */
.pill { display: inline-flex; align-items: center; font-size: var(--fs-caption); font-weight: 500; line-height: 1; padding: .5em .85em; border-radius: var(--r-pill); background: var(--material); color: var(--label); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); white-space: nowrap; }

/* Back to the cover: top-leading, over the photo's corner on product slides; a filled pill at the head of the list's eyebrow. */
.back { position: absolute; top: calc(var(--safe-y) + var(--gap-2)); left: calc(var(--safe-x) + var(--gap-2)); z-index: 2; gap: .4em; padding-left: .7em; }
.back svg { width: .55em; height: .9em; display: block; }
.list .back { position: static; background: var(--fill); backdrop-filter: none; -webkit-backdrop-filter: none; margin-right: .2em; }

.cap { font-size: var(--fs-caption); font-weight: 500; color: var(--label-2); display: flex; align-items: center; gap: .6em; }
.cap > span { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* the eyebrow never wraps */
.title { font-size: var(--fs-title); font-weight: 600; letter-spacing: -.022em; line-height: 1.06; margin-top: var(--gap-2); text-wrap: balance; }
.title.long { font-size: var(--fs-title-long); }
.sub { font-size: var(--fs-headline); color: var(--label-2); margin-top: var(--gap-1); line-height: 1.25; letter-spacing: -.01em; }
.desc { font-size: var(--fs-body); line-height: 1.35; margin-top: var(--gap-3); max-width: 40ch; }
.chips { display: flex; flex-wrap: wrap; gap: var(--gap-1); margin-top: var(--gap-2); }
.chip { font-size: var(--fs-caption); font-weight: 500; line-height: 1; padding: .5em .85em; border-radius: var(--r-pill); background: var(--fill); }

/* Details: an inset grouped list of label · value rows, caption size so it reads as reference, not prose. */
.details { margin-top: var(--gap-3); background: var(--container); border-radius: var(--r-lg); padding: 0 var(--gap-2); }
.detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--gap-2); padding: calc(var(--gap-2) * .7) 0; border-top: 1px solid var(--separator); font-size: var(--fs-caption); line-height: 1.3; }
.detail:first-child { border-top: 0; }
.detail .k { color: var(--label-2); white-space: nowrap; }
.detail .v { text-align: right; text-wrap: balance; }

.buy { padding-top: var(--gap-3); display: flex; align-items: last baseline; gap: var(--gap-3); flex-wrap: wrap; }
.price { font-size: var(--fs-price); font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.price small { font-size: var(--fs-headline); font-weight: 400; letter-spacing: -.01em; color: var(--label-2); margin-left: .3em; }
.price.tbd { font-size: var(--fs-title-long); font-weight: 500; letter-spacing: -.01em; color: var(--label-2); }
.cmp { font-size: var(--fs-body); color: var(--label-2); line-height: 1.35; }
.cmp s { text-decoration-thickness: .08em; }
.cmp .set { color: var(--label); }
.range { white-space: nowrap; }   /* "£750 – 1,250" stays together */
.cmp > span { display: block; }

/* Hold band: a held lot — sold, reserved or no longer available — keeps its photo in full colour and takes a scrim band across the foot of the photo
   container, the state in caps — the one uppercase in the deck, borrowed from the marketplaces so it reads as a stamp on
   the picture rather than as the deck's own prose. The slide's band names the person ("Reserved for Ana"), a cover card's
   just says the word. It is the last child of .photo / .card .im, and its offsets resolve against the padding box, so it
   spans edge to edge whatever the photo grid's padding. The lot's price is struck through beside it, and the list row
   carries the same word as a .tag — the three surfaces always agree. */
.band { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: .85em 1.3em; background: var(--scrim); color: var(--on-scrim); font-size: var(--fs-caption); font-weight: 600; letter-spacing: .08em; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); pointer-events: none; }
.card .band { padding: .5em .7em; font-size: .95rem; }
.price s, .card .p s, .row .p s { color: var(--label-2); }
.price s { text-decoration-thickness: .05em; }
/* The tag: the band's word on a list row, where there is no photo to put it on. Same shape as a .chip. */
.tag { display: inline-block; margin-right: .55em; padding: .28em .6em; border-radius: var(--r-pill); background: var(--fill); color: var(--label-2); font-size: .78em; font-weight: 600; letter-spacing: .07em; line-height: 1; text-transform: uppercase; vertical-align: .1em; }

.dots { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-y) * .4); display: flex; justify-content: center; gap: var(--gap-1); }
.dots i { width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--label-3); }
.dots i.on { background: var(--label); }

/* ── Cover ──────────────────────────────────────────────── */
.cover, .list { display: flex; flex-direction: column; padding: var(--safe-y) var(--safe-x); }
.list h1 { font-size: var(--fs-large); font-weight: 600; letter-spacing: -.025em; line-height: 1.05; margin-top: var(--gap-1); }
/* Brand line: the deck title at Headline size with the count and month beside it — one row, so the rooms get the screen. */
.brand { display: flex; align-items: baseline; gap: var(--gap-2); }
.brand .name { font-size: var(--fs-headline); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
/* Tab bar: a segmented control naming the rooms; the selected tab is a lifted pill. */
.tabs { display: inline-flex; align-self: flex-start; max-width: 100%; gap: .4em; margin-top: var(--gap-3); padding: .35rem; background: var(--container); border-radius: var(--r-pill); }
.tab .c { display: none; }   /* the count and chevron show only on phones, where the tabs are a room index */
.tab { font-size: var(--fs-body); font-weight: 500; line-height: 1; padding: .5em 1em; border-radius: var(--r-pill); color: var(--label-2); white-space: nowrap; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.tab.on { background: var(--tab-on); color: var(--label); box-shadow: var(--shadow); }
/* Pager: one page of cards per room, snapping sideways. The page's own heading shows only on phones, where the rooms stack. */
.pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; margin-top: var(--gap-4); }
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; display: flex; flex-direction: column; }
.room { display: none; }
.cards { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--gap-2); padding: var(--gap-1) var(--gap-1) var(--gap-2); }
.card { position: relative; background: var(--container); border-radius: var(--r-lg); padding: var(--gap-2); display: flex; flex-direction: column; min-height: 0; transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.card:focus-visible { transform: scale(1.04); box-shadow: var(--shadow); z-index: 1; }
@media (hover: hover) { .card:hover { transform: scale(1.04); box-shadow: var(--shadow); z-index: 1; } }
@media (hover: none) { .card:active, .row:active, .tab:active, .photo .cell:active { opacity: .6; } }   /* touch: a press dims, like a Settings row */
.card .im { position: relative; flex: 1; min-height: 0; border-radius: var(--r-md); overflow: hidden; background: var(--fill); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .t { font-size: var(--fs-card); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; margin-top: var(--gap-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .p { font-size: var(--fs-caption); color: var(--label-2); margin-top: .2em; font-variant-numeric: tabular-nums; }

/* ── List (last slide) ──────────────────────────────────── */
.groups { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr; gap: var(--gap-3); margin-top: var(--gap-4); align-items: start; }
.groups.two { grid-template-columns: 1fr 1fr; }
.group { background: var(--container); border-radius: var(--r-lg); padding: 0 var(--gap-3); }
.row { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--gap-2); align-items: center; padding: var(--gap-2) 0; border-top: 1px solid var(--separator); font-size: var(--fs-body); }
.row:first-child { border-top: 0; }
.row .th { width: var(--thumb); height: var(--thumb); border-radius: var(--r-md); object-fit: cover; background: var(--fill); display: block; }
.row .t { line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t small { display: block; font-size: var(--fs-caption); color: var(--label-2); margin-top: .15em; }
.row .p { font-weight: 600; font-variant-numeric: tabular-nums; }
.list.dense .row { padding: var(--gap-1) 0; font-size: var(--fs-caption); }
.list.dense .row .th, .list.dense .row small { display: none; }
.foot { margin-top: auto; padding-top: var(--gap-3); display: flex; align-items: center; justify-content: space-between; gap: var(--gap-2); }
.btn { display: inline-block; font-size: var(--fs-body); font-weight: 600; line-height: 1; padding: .7em 1.3em; border-radius: var(--r-pill); background: var(--tint); color: var(--on-tint); }

/* ── Motion ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .slide, .card, .tab { transition: none; }
  .slide { transform: none; }
  .card:hover, .card:focus-visible { transform: none; }
}

/* ── Phones / portrait windows ──────────────────────────── */
@media (max-width: 820px), (orientation: portrait) {
  html, body { height: auto; overflow: visible; }
  body { min-height: 100vh; min-height: 100dvh; touch-action: pan-y pinch-zoom; }
  .slide { position: relative; inset: auto; opacity: 1; transform: none; display: none; min-height: 100vh; min-height: 100dvh; transition: none; }
  .slide.active { display: block; }
  .slide.cover.active, .slide.list.active { display: flex; }
  .body { position: relative; inset: auto; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding: calc(var(--safe-y) + env(safe-area-inset-top, 0px)) var(--safe-x) 0; }
  .body > * { flex: none; }
  .body > :nth-last-child(2) { margin-bottom: var(--gap-4); }   /* room between the last row and the price bar when they meet */
  .photo { height: 52vh; }
  .head { margin-top: var(--gap-4); }
  .card .band { padding: 4px 7px; font-size: 9px; letter-spacing: .06em; }
  .photo.held { --band-h: 36px; }
  .cap { flex-wrap: wrap; row-gap: var(--gap-1); }
  /* Price bar: the price and one compare line, pinned to the foot of the lot. */
  .buy { position: sticky; bottom: 0; z-index: 3; align-self: stretch; margin: auto calc(-1 * var(--safe-x)) 0; padding: 12px var(--safe-x) max(14px, env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--separator); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "price" "cmp"; align-items: center; }
  .price { grid-area: price; }
  .cmp { grid-area: cmp; font-size: var(--fs-caption); margin-top: 5px; }
  .cmp > span { display: inline; }
  .cmp > span ~ span::before { content: " · "; }
  .dots { display: none; }
  /* Cover: an iOS large title, then the rooms as an inset list with their counts — tap one and the page scrolls to it. Nothing scrolls sideways. */
  .brand { display: block; }
  .brand .name { font-size: var(--fs-large); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .brand .cap { margin-top: 3px; font-size: var(--fs-body); }
  .tabs { display: block; align-self: stretch; max-width: none; gap: 0; margin-top: var(--gap-3); padding: 0 var(--gap-3); background: var(--container); border-radius: var(--r-lg); }
  .tab { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: var(--gap-2); min-height: 46px; padding: 0; border-top: 1px solid var(--separator); border-radius: 0; font-size: var(--fs-headline); color: var(--label); background: none; }
  .tab:first-child { border-top: 0; }
  .tab.on { background: none; color: var(--label); box-shadow: none; }
  .tab .c { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-body); color: var(--label-2); }
  .tab .c svg { width: 8px; height: 13px; display: block; }
  .pager { display: block; overflow: visible; flex: none; scroll-snap-type: none; }
  .page { display: block; margin-top: var(--gap-4); scroll-margin-top: var(--gap-3); }
  .room { display: block; font-size: var(--fs-title-long); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 0 var(--gap-1) var(--gap-1); }
  .room small { font-size: var(--fs-body); font-weight: 500; color: var(--label-2); margin-left: 8px; letter-spacing: 0; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; flex: none; }
  .card .im { flex: none; height: 36vw; }
  .groups { overflow: visible; flex: none; }
  .groups.two { grid-template-columns: 1fr; }
  .foot { flex-direction: column; align-items: flex-start; }
}

/* ── Shipping list ──────────────────────────────────────────
   The private page at the end of the deck: what goes to Escazú, with the
   sizes the movers price on. Same inset grouped list as .details, three
   columns — what it is, how big, how heavy — and a footing row that adds
   up the cube. A lot still to be measured is dimmed and carries "to measure"
   in place of its size, so the gaps are visible at a glance. */
.ship .groups { overflow: auto; align-items: start; }
.scol { display: flex; flex-direction: column; min-width: 0; }
.ship .gname { font-size: var(--fs-caption); font-weight: 600; color: var(--label-2); letter-spacing: .04em; text-transform: uppercase; margin: 0 var(--gap-3) var(--gap-1); }
.ship .group { margin-bottom: var(--gap-3); }
.ship .group:last-child { margin-bottom: 0; }
.ship .gnote { font-size: var(--fs-caption); color: var(--label-2); margin: calc(var(--gap-1) * -1) var(--gap-3) var(--gap-1); }
.srow { display: grid; grid-template-columns: minmax(7em, 1fr) auto auto; gap: var(--gap-2); align-items: baseline; padding: calc(var(--gap-2) * .48) 0; border-top: 1px solid var(--separator); font-size: var(--fs-caption); line-height: 1.28; }
.srow:first-child { border-top: 0; }
.srow .n { min-width: 0; }
.srow .n small { display: block; color: var(--label-2); margin-top: .15em; }
.srow .d, .srow .w { color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.srow .w { min-width: 5em; }
.srow.todo .d { color: var(--label-3); }
.srow.tot { font-weight: 600; }
.srow.tot .d, .srow.tot .w { color: var(--label); }
.qty { display: inline-block; padding: .18em .5em; margin-left: .4em; border-radius: var(--r-pill); background: var(--fill); color: var(--label-2); font-size: .85em; font-weight: 600; line-height: 1.2; vertical-align: .05em; }
.prompts { display: flex; flex-wrap: wrap; gap: var(--gap-1); padding: calc(var(--gap-2) * .7) 0; }
/* The running total lives in the footing, where it stays put while the lists scroll. */
.ship .foot { padding-top: var(--gap-3); align-items: baseline; }
.ship .foot .sum { font-size: var(--fs-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.ship .foot .sum span { font-weight: 400; color: var(--label-2); margin-left: .5em; }
.ship .foot .note { display: block; font-size: var(--fs-caption); font-weight: 400; color: var(--label-2); margin-top: .25em; }
.acts { display: flex; gap: var(--gap-1); flex: none; }
.acts .pill { background: var(--fill); backdrop-filter: none; -webkit-backdrop-filter: none; cursor: pointer; }

@media (max-width: 820px), (orientation: portrait) {
  /* Phones: the name takes the first line, size and weight the second. */
  .srow { grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--gap-2); }
  .srow .n { grid-column: 1 / -1; }
  .srow .d { text-align: left; }
}

      </div>
      ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
      ${rows.length ? `<div class="details">${rows.map(([k, v]) => `<div class="detail"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>` : ''}
      <div class="buy">
        ${p.asking_price === 0 ? `<div class="price">${p.held ? '<s>Free</s>' : 'Free'}</div>` : typeof p.asking_price === 'number' ? `<div class="price">${p.held ? `<s>${money(p.asking_price)}</s>` : money(p.asking_price)}${p.price_unit ? `<small>${esc(p.price_unit)}</small>` : ''}</div>` : '<div class="price tbd">Price soon</div>'}
        ${cmp ? `<div class="cmp">${cmp}</div>` : ''}
      </div>
    </div>
    ${P.length <= 12 ? `<div class="dots" aria-hidden="true">${P.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>` : ''}
  </section>`;
}

function list() {
  const two = P.length > 6;
  const half = Math.ceil(P.length / 2);
  const groups = two ? [P.slice(0, half), P.slice(half)] : [P];
  const row = p => { const i = P.indexOf(p); return `
      <button class="row" data-go="${i + 1}">${p.photos[0] ? `<img class="th" src="${src(p, p.photos[0])}" alt="">` : '<span class="th"></span>'}<span class="t">${esc(p.title)}${p.condition ? `<small>${esc(p.condition)}</small>` : ''}</span><span class="p">${p.held ? `<span class="tag">${esc(word(p))}</span>` : ''}${priced(p) || 'Price soon'}</span></button>`; };
  return `<section class="slide list ${P.length > 16 ? 'dense' : ''}">
    <div class="cap">${back}<span>${lots(P.length)}</span><span>·</span><span>${esc(when)}</span><button class="pill" data-go="${P.length + 2}">Shipping</button></div>
    <h1>Everything</h1>
    <div class="groups ${two ? 'two' : ''}">${groups.map(g => `<div class="group">${g.map(row).join('')}</div>`).join('')}</div>
    ${C.contact || C.footnote ? `<div class="foot">${C.contact ? `<span class="btn">${esc(C.contact)}</span>` : '<span></span>'}${C.footnote ? `<span class="cap">${esc(C.footnote)}</span>` : ''}</div>` : ''}
  </section>`;
}

// ── Shipping list ─────────────────────────────────────────────────────────
// The last slide: what goes to Costa Rica, not what is for sale.
//
// Every size here is the lot AS IT TRAVELS, not as it stands in the flat — the
// desk goes on the pallet in pieces, so it is measured in pieces. `m3` is the
// space it takes on the pallet; `est` marks a figure to confirm when the lot is
// actually apart, `measure` one not yet measured at all, which is left out of
// the total rather than guessed at. `es` / `es_s` / `des` are the Spanish the
// export sends to Dinia; anything that reads the same in both is left out.
const SHIP = {
  from: 'London',
  to: 'Escazú',
  groups: [
    {
      name: 'Going', es: 'VA',
      items: [
        { t: 'Thermomix TM6', d: '32.6 × 32.6 × 34.1 cm', kg: 7.95, m3: 0.036 },
        { t: 'Technogym Bench', es: 'Banca Technogym', s: 'weights, bands and mat inside', es_s: 'con pesas, bandas y colchoneta dentro', d: '113 × 38 × 45.5 cm', kg: 99, m3: 0.195 },
        { t: 'Secretlab MAGNUS desk', es: 'Mueble de casa', s: 'travels apart · 73.5 cm tall assembled', es_s: 'de metal · viaja desarmado', d: '150 × 70 cm top, frame apart', des: '150 × 70 cm el tablero, estructura aparte', kg: 42, m3: 0.10, est: true },
        { t: 'Vesper coffee table', es: 'Mesa de centro Vesper', s: 'pine trunk · travels full', es_s: 'baúl de pino · viaja lleno', d: '85 × 48 × 45 cm', m3: 0.184 },
        { t: 'IKEA KUGGIS boxes', es: 'Cajas IKEA KUGGIS', q: 2, s: 'white, with lids', es_s: 'blancas, con tapa', d: '54 × 37 × 21 cm each', des: '54 × 37 × 21 cm c/u', m3: 0.084 },
        { t: 'Iris Ohyama TB-30 boxes', es: 'Cajas Iris Ohyama TB-30', q: 5, s: 'transparent, 30 L each', es_s: 'transparentes, 30 L c/u', d: 'to measure', des: 'por medir', measure: true },
        { t: 'Black storage boxes', es: 'Cajas negras', q: 3, d: 'to measure', des: 'por medir', measure: true },
        { t: 'Joseph Joseph pocket ironing board', es: 'Tabla de planchar plegable Joseph Joseph', s: 'no iron', es_s: 'sin plancha', d: '34 × 15.5 × 45.5 cm folded', des: '34 × 15.5 × 45.5 cm plegada', m3: 0.024 },
        { t: 'simplehuman 30 L bin', es: 'Basurero simplehuman 30 L', d: '33.9 × 28.9 × 71 cm', kg: 5.85, m3: 0.070 },
        { t: 'Joseph Joseph Tota 90 L laundry basket', es: 'Cesto de ropa Joseph Joseph Tota 90 L', s: 'two removable totes inside', es_s: 'con sus dos bolsas dentro', d: '56 × 39.5 × 71 cm', m3: 0.157 },
        { t: 'EZ curl bar set', es: 'Barra Z con discos', s: 'plus 18.5 kg of plates and two collars', es_s: 'más 18.5 kg de discos y dos collarines', d: 'bar 120 cm', des: 'barra 120 cm', kg: 23.5, m3: 0.05, est: true },
        { t: 'Sonos One', es: 'Parlantes Sonos One', q: 2, s: '1.85 kg each · manufacturer figures', es_s: '1.85 kg c/u · medidas del fabricante', d: '16.1 × 12 × 12 cm each', des: '16.1 × 12 × 12 cm c/u', kg: 3.7, m3: 0.005 },
        { t: 'Balolo Setup Cockpit', es: 'Soporte de monitor Balolo', s: 'monitor stand with the laptop dock', es_s: 'soporte de monitor con base para laptop', d: '114 × 23 × 12 cm', kg: 3.8, m3: 0.031 },
        { t: 'Herman Miller Aeron', es: 'Silla Herman Miller Aeron', s: 'size B · 93 cm at its lowest setting', es_s: 'talla B · 93 cm en su posición más baja', d: '72 × 70 × 93 cm', kg: 18.6, m3: 0.469 },
        { t: 'Ellipse ceramic dining table', es: 'Mesa de comedor Ellipse', s: 'travels apart · ceramic top on edge, crated', es_s: 'viaja desarmada · sobre de cerámica de canto, en caja', d: 'Ø 120 cm top, base apart', des: 'sobre Ø 120 cm, base aparte', kg: 49, m3: 0.39, est: true },
        { t: 'Boardman HYB 8.8', es: 'Bicicleta Boardman HYB 8.8', s: 'hybrid · manufacturer weight, built · frame size to confirm', es_s: 'híbrida · peso del fabricante, armada · talla por confirmar', d: 'to measure — boxed or as it stands', des: 'por medir — encajada o armada', kg: 10.4, measure: true },
      ],
    },
    {
      name: 'Still to decide', es: 'POR CONFIRMAR',
      note: 'Sizes ready — say the word and they move up.',
      items: [
      ],
    },
  ],
  // Quote DE-26-022-2 (Allianz Moving CRC via ASEAL, 3 September 2026), door to door,
  // consolidated: 2.5 m³ for US$5,495, 5 m³ for US$5,595. A hundred dollars buys the
  // second 2.5 m³ — about $40 a cubic metre — so the service is what costs, not the
  // volume. Fede is taking the 5 m³ tier; the ceiling below is that.
  quote: { ref: 'DE-26-022-2', m3: 5, usd: 5595, base: { m3: 2.5, usd: 5495 }, perM3: 40, valid: '3 October 2026' },
  prompts: ['Clothes and shoes', 'Bedding and towels', 'Kitchenware', 'Nespresso machine', 'Books and documents', 'Suitcases', 'Cables and electronics', 'Art and frames'],
  es_prompts: ['Ropa y zapatos', 'Ropa de cama y toallas', 'Cosas de cocina', 'Máquina Nespresso', 'Libros y documentos', 'Maletas', 'Cables y electrónica', 'Cuadros'],
};
const going = SHIP.groups[0].items;
const toMeasure = going.filter(i => i.measure);
const anyEst = going.some(i => i.est);
const sumM3 = going.reduce((s, i) => s + (i.m3 || 0), 0);
const sumKg = going.reduce((s, i) => s + (i.kg || 0), 0);
const count = going.reduce((s, i) => s + (i.q || 1), 0);
const kilos = n => n.toLocaleString('en-GB', { maximumFractionDigits: 2 }) + ' kg';
const cube = n => (anyEst ? '≈' : '') + n.toFixed(2) + ' m³';

const shipRow = it => `<div class="srow${it.measure ? ' todo' : ''}">
        <span class="n">${esc(it.t)}${it.q ? `<span class="qty">× ${it.q}</span>` : ''}${it.s ? `<small>${esc(it.s)}</small>` : ''}</span>
        <span class="d">${esc(it.d || '—')}</span>
        <span class="w">${it.kg ? esc(kilos(it.kg)) : ''}</span>
      </div>`;
function shipping() {
  const undecided = SHIP.groups[1].items;
  const half = Math.ceil(going.length / 2);
  const rows = list => `<div class="group">${list.map(shipRow).join('')}</div>`;
  const head = (name, extra) => `<p class="gname">${esc(name)}${extra ? ` · ${extra}` : ''}</p>`;
  const promptsBlock = head('Not counted yet') + `<div class="group"><div class="prompts">${SHIP.prompts.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>`;
  const block = (g, i) => !g.items.length ? '' : `
      <p class="gname">${esc(g.name)}${i === 0 ? ` · ${count} items` : ''}</p>
      ${g.note ? `<p class="gnote">${esc(g.note)}</p>` : ''}
      <div class="group">${g.items.map(shipRow).join('')}</div>`;
  return `<section class="slide list ship">
    <div class="cap">${back}<span>${esc(SHIP.from)} → ${esc(SHIP.to)}</span></div>
    <h1>Shipping</h1>
    <div class="groups two">
      <div class="scol">${head('Going', `${count} items`)}${rows(undecided.length ? going : going.slice(0, half))}
        ${undecided.length ? '' : promptsBlock}</div>
      <div class="scol">${undecided.length ? block(SHIP.groups[1], 1) + promptsBlock : head('Going', 'continued') + rows(going.slice(half))}
      </div>
    </div>
    <div class="foot">
      <span class="sum">${cube(sumM3)} of ${SHIP.quote.m3} m³ · ${kilos(sumKg)}<span>packed${toMeasure.length ? ` · ${toMeasure.length} still to measure` : ''}</span>
        <small class="note">Sizes are as the lot travels — the desk and the table apart. Quote ${SHIP.quote.ref} covers ${SHIP.quote.m3} m³ door to door, consolidated, at US$${SHIP.quote.usd.toLocaleString('en-GB')} — ${SHIP.quote.base.m3} m³ costs US$${SHIP.quote.base.usd.toLocaleString('en-GB')}, so the extra volume runs about $${SHIP.quote.perM3} a cubic metre; the rate is subject to final volume, and oversized items are excluded. Nothing under &quot;not counted yet&quot; is in the figure.</small></span>
      <span class="acts"><button class="pill" data-copy>Copy for Dinia</button><button class="pill" data-csv>CSV</button></span>
    </div>
  </section>`;
}

// ── Export ────────────────────────────────────────────────────────────────
// Two shapes of the same list, both in Spanish, because it is Dinia who reads
// it: a message to paste into an email, and a CSV for the article-by-article
// file she uses to work out the insurance value.
const es = it => it.es || it.t;
const esD = it => it.des || it.d || '—';
const head = `Menaje de casa — lista de artículos\nLondres → ${SHIP.to}\nMedidas externas, tal como viaja cada artículo (el mueble de metal y la mesa de comedor van desarmados).`;
function asText() {
  const line = it => `- ${es(it)}${it.q ? ` (${it.q})` : ''} — ${esD(it)}${it.kg ? ` · ${kilos(it.kg)}` : ''}${it.es_s || it.s ? ` — ${it.es_s || it.s}` : ''}`;
  const pend = toMeasure.length ? `\nPendiente de medir: ${toMeasure.map(i => `${es(i)}${i.q ? ` (${i.q})` : ''}`).join(', ')}.` : '';
  return `${head}\n\n${SHIP.groups[0].es} — ${count} artículos · ${cube(sumM3)} · ${kilos(sumKg)}\n`
    + going.map(line).join('\n') + pend
    + (SHIP.groups[1].items.length ? `\n\n${SHIP.groups[1].es}\n` + SHIP.groups[1].items.map(line).join('\n') : '')
    + `\n\nSIN CONTAR TODAVÍA\n${SHIP.es_prompts.join(', ')}.\n`;
}
function asCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const row = (it, g) => [es(it), it.q || 1, esD(it), it.kg ?? '', it.m3 ?? '', g, it.es_s || it.s || ''].map(q).join(',');
  return '\ufeff' + ['Artículo', 'Cantidad', 'Medidas (cm)', 'Peso (kg)', 'Volumen (m³)', 'Grupo', 'Notas'].map(q).join(',') + '\n'
    + SHIP.groups.map(g => g.items.map(it => row(it, g.es)).join('\n')).join('\n') + '\n';
}
function flash(btn, msg) { const was = btn.textContent; btn.textContent = msg; setTimeout(() => { btn.textContent = was; }, 1600); }
async function copyList(btn) {
  const text = asText();
  try { await navigator.clipboard.writeText(text); return flash(btn, 'Copied'); } catch (e) { /* no clipboard: fall back */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); flash(btn, ok ? 'Copied' : 'Could not copy');
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: `${type};charset=utf-8` }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy) return copyList(copy);
  const csv = e.target.closest('[data-csv]');
  if (csv) { download('menaje-carbo.csv', asCSV(), 'text/csv'); flash(csv, 'Saved'); }
});

document.getElementById('deck').innerHTML = cover() + P.map(product).join('') + list() + shipping();
const slides = [...document.querySelectorAll('.slide')];
let cur = 0;

const lot = slide => P.find(x => x.slug === slide.dataset.slug);

// Cover tabs: the pager snaps sideways to the room's page (on phones the rooms stack under a room index, so it scrolls down to the room instead).
const pager = document.querySelector('.pager'), tabs = [...document.querySelectorAll('.tab')], pages = [...document.querySelectorAll('.page')];
let tab = 0;
function showTab(i, smooth = true) {
  if (!pages.length) return;
  tab = Math.max(0, Math.min(pages.length - 1, i));
  tabs.forEach((t, j) => { t.classList.toggle('on', j === tab); t.setAttribute('aria-selected', j === tab); });
  const behavior = smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'instant';
  if (phone()) pages[tab].scrollIntoView({ behavior, block: 'start' });
  else pager.scrollTo({ left: tab * pager.clientWidth, behavior });
}
// A trackpad or finger can move the pager too: follow it once the scroll settles.
const syncTab = () => { if (phone() || !pages.length) return; const i = Math.round(pager.scrollLeft / pager.clientWidth); if (i !== tab) showTab(i, false); };
let st;
pager?.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(syncTab, 120); }, { passive: true });
pager?.addEventListener('scrollend', syncTab);

function show(i) {
  if (slides[cur]) showGrid(slides[cur]);
  const from = slides[cur] ? lot(slides[cur]) : null;
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => s.classList.toggle('active', j === cur));
  history.replaceState(null, '', cur ? '#' + cur : location.pathname);
  if (phone()) { scrollTo(0, 0); document.body.scrollTop = 0; }   // whichever of the window or the body is the scroller
  if (cur === 0 && from) showTab(sections.findIndex(s => s.lots.includes(from)), false); // the cover opens on the room you came from
}
// On the cover, → and ← move along the tabs; the last tab leads on to lot 1. Elsewhere they change slide.
const onCover = () => cur === 0 && !phone();
function next() { if (onCover() && tab < pages.length - 1) showTab(tab + 1); else show(cur + 1); }
function prev() { if (onCover()) { if (tab > 0) showTab(tab - 1); } else show(cur - 1); }

// Photo focus: one photo fills the container; ↑ ↓ or a click move through them; Esc or "Show all" returns to the grid.
function showPhoto(slide, i) {
  const p = lot(slide);
  if (!p || !p.photos.length) return;
  const box = slide.querySelector('.photo');
  const idx = (i + p.photos.length) % p.photos.length;
  box.classList.add('focus');
  box.classList.remove('cols', 'rows');
  box.dataset.n = 1;
  box.dataset.focus = idx;
  box.innerHTML = photoFocus(p, idx);
}
function showGrid(slide) {
  const p = lot(slide);
  const box = slide.querySelector('.photo');
  if (!p || !box || !box.classList.contains('focus')) return;
  box.classList.remove('focus');
  if (shapeOf(p)) box.classList.add(shapeOf(p));
  box.dataset.n = shown(p);
  delete box.dataset.focus;
  box.innerHTML = photoGrid(p);
}
function cyclePhoto(dir) {
  const slide = slides[cur], box = slide.querySelector('.photo');
  if (!box) return;
  const p = lot(slide);
  if (!p || !p.photos.length) return;
  if (!box.classList.contains('focus')) return showPhoto(slide, dir < 0 ? p.photos.length - 1 : 0);
  showPhoto(slide, +box.dataset.focus + dir);
}

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { if (k === 'Enter' && e.target.closest?.('[data-go], [data-grid], [data-tab]')) return; e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); cyclePhoto(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); cyclePhoto(-1); }
  else if (k === 'Escape') showGrid(slides[cur]);
  else if (k === 'Home' || k.toLowerCase() === 'o') show(0);
  else if (k === 'End' || k.toLowerCase() === 'l') show(slides.length - 1);
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) return showTab(+t.dataset.tab);
  const go = e.target.closest('[data-go]');
  if (go) return show(+go.dataset.go);
  if (e.target.closest('[data-grid]')) return showGrid(slides[cur]);
  const cell = e.target.closest('[data-cell]');
  if (!cell) return;
  const box = cell.closest('.photo');
  if (box.classList.contains('focus')) cyclePhoto(1); else showPhoto(slides[cur], +cell.dataset.cell);
});
// Swipe to change lot. The gesture locks to an axis in its first centimetre, like a scroll view: only a clearly sideways
// one counts, so scrolling the page (even a slightly diagonal scroll) never changes slide. A swipe inside the pager (on a
// TV-sized touch screen) scrolls the rooms natively, and a second finger cancels.
let tx = null, ty = null, axis = null;
addEventListener('touchstart', e => {
  const t = e.touches[0];
  tx = e.touches.length > 1 || (!phone() && e.target.closest('.pager')) ? null : t.clientX;
  ty = t.clientY; axis = null;
}, { passive: true });
addEventListener('touchmove', e => {
  if (tx === null || axis) return;
  if (e.touches.length > 1) { tx = null; return; }
  const dx = Math.abs(e.touches[0].clientX - tx), dy = Math.abs(e.touches[0].clientY - ty);
  if (Math.max(dx, dy) < 10) return;
  axis = dx > dy * 1.5 ? 'x' : 'y';
}, { passive: true });
addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (axis === 'x' && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) show(cur + (dx < 0 ? 1 : -1));
  tx = null; axis = null;
});
addEventListener('touchcancel', () => { tx = null; axis = null; });
show(parseInt(location.hash.slice(1)) || 0);

</script>
